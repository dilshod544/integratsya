# Запуск в контейнерах (необязательно — проект работает и просто через ./run.sh).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: bank_intelligence
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bank}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d bank_intelligence"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bank:${POSTGRES_PASSWORD:-bank}@db:5432/bank_intelligence
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data      # admin_credentials.txt и прочие файлы приложения

volumes:
  pgdata:
