<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Вход — Cash Management AI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0b0f19;
    --surface: rgba(22, 30, 49, 0.78);
    --border: rgba(255, 255, 255, 0.10);
    --text: #f3f4f6;
    --muted: #9ca3af;
    --blue: #3b82f6;
    --blue-2: #2563eb;
    --green: #10b981;
    --danger: #f87171;
    --ok: #34d399;
    --field: rgba(11, 15, 25, 0.72);
    --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.45);
  }

  html, body { height: 100%; }
  body {
    min-height: 100vh;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text);
    background: radial-gradient(circle at 12% 18%, #101830 0%, var(--bg) 90%);
    display: grid;
    place-items: center;
    padding: 28px 18px;
    overflow-x: hidden;
  }

  /* Soft dashboard-style glows */
  .glow {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    pointer-events: none;
    z-index: 0;
  }
  .glow.a {
    width: 520px; height: 520px;
    background: #1d4ed8;
    top: -180px; left: -140px;
    opacity: .38;
    animation: glowDrift 16s ease-in-out infinite;
  }
  .glow.b {
    width: 460px; height: 460px;
    background: #047857;
    bottom: -180px; right: -120px;
    opacity: .32;
    animation: glowDrift 20s ease-in-out infinite reverse;
  }
  .glow.c {
    width: 280px; height: 280px;
    background: #2563eb;
    top: 42%; right: 18%;
    opacity: .14;
    animation: glowDrift 22s 2s ease-in-out infinite;
  }
  @keyframes glowDrift {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(36px, 28px) scale(1.08); }
  }

  .stage {
    position: relative;
    z-index: 1;
    width: min(520px, 100%);
    animation: rise .7s cubic-bezier(.22, 1, .36, 1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: none; }
  }

  .brand {
    text-align: center;
    margin-bottom: 22px;
  }
  .logo {
    width: 52px; height: 52px;
    margin: 0 auto 16px;
    border-radius: 14px;
    display: grid; place-items: center;
    background: linear-gradient(135deg, #60a5fa, #34d399);
    color: #0b0f19;
    font-weight: 900;
    font-size: 15px;
    letter-spacing: -.02em;
    animation: logoIn .8s .05s cubic-bezier(.22, 1, .36, 1) both;
  }
  @keyframes logoIn {
    from { opacity: 0; transform: scale(.88); }
    to { opacity: 1; transform: none; }
  }

  h1 {
    font-size: clamp(28px, 5.5vw, 38px);
    font-weight: 850;
    letter-spacing: -.03em;
    line-height: 1.1;
  }
  h1 span {
    background: linear-gradient(135deg, #60a5fa, #34d399);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    background-size: 160% 160%;
    animation: sheen 7s ease-in-out infinite;
  }
  @keyframes sheen {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .lead {
    margin-top: 10px;
    color: var(--muted);
    font-size: 14.5px;
    line-height: 1.55;
  }

  .card {
    margin-top: 26px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 36px 34px 30px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: var(--shadow-lg);
    animation: rise .85s .1s cubic-bezier(.22, 1, .36, 1) both;
    min-height: 390px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .panel { display: none; }
  .panel.active {
    display: block;
    animation: fadeIn .35s ease both;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }

  .sub {
    color: var(--muted);
    font-size: 13.5px;
    line-height: 1.5;
    margin-bottom: 22px;
    font-weight: 500;
  }

  label.lbl {
    display: block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 7px;
  }

  .field {
    width: 100%;
    padding: 13px 14px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--field);
    color: var(--text);
    font: 600 14.5px/1.3 Inter, ui-sans-serif, system-ui, sans-serif;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
    -webkit-appearance: none;
    appearance: none;
  }
  .field:focus {
    border-color: rgba(96, 165, 250, .55);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, .18);
  }
  .field:-webkit-autofill,
  .field:-webkit-autofill:hover,
  .field:-webkit-autofill:focus,
  .field:-webkit-autofill:active {
    -webkit-text-fill-color: var(--text) !important;
    caret-color: var(--text);
    box-shadow: 0 0 0 1000px #0b0f19 inset !important;
    transition: background-color 99999s ease-out;
  }

  .remember {
    display: flex;
    align-items: center;
    gap: 9px;
    margin: 2px 0 20px;
    color: var(--text);
    font-size: 13.5px;
    font-weight: 600;
    user-select: none;
  }
  .remember input {
    width: 16px; height: 16px; margin: 0;
    accent-color: var(--blue);
  }

  .btn {
    width: 100%;
    padding: 13px 14px;
    border: 0;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--blue), var(--blue-2));
    color: #fff;
    font: 750 14.5px/1 Inter, ui-sans-serif, system-ui, sans-serif;
    cursor: pointer;
    transition: transform .15s ease, filter .15s ease, box-shadow .15s ease;
  }
  .btn:hover:not(:disabled) {
    filter: brightness(1.06);
    transform: translateY(-1px);
    box-shadow: 0 10px 24px rgba(37, 99, 235, .28);
  }
  .btn:active:not(:disabled) { transform: none; }
  .btn:disabled { opacity: .6; cursor: default; transform: none; box-shadow: none; }

  .error, .ok {
    display: none;
    margin-bottom: 14px;
    padding: 10px 12px;
    border-radius: 11px;
    font-size: 12.5px;
    font-weight: 650;
    line-height: 1.35;
  }
  .error {
    background: rgba(248, 113, 113, .12);
    border: 1px solid rgba(248, 113, 113, .28);
    color: var(--danger);
  }
  .ok {
    background: rgba(52, 211, 153, .12);
    border: 1px solid rgba(52, 211, 153, .28);
    color: var(--ok);
  }

  @media (max-width: 520px) {
    .card {
      padding: 26px 20px 22px;
      min-height: 0;
      border-radius: 18px;
    }
    h1 { font-size: 26px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .glow, h1 span, .stage, .card, .logo, .panel.active {
      animation: none !important;
    }
  }
</style>
</head>
<body>
  <div class="glow a" aria-hidden="true"></div>
  <div class="glow b" aria-hidden="true"></div>
  <div class="glow c" aria-hidden="true"></div>

  <div class="stage">
    <div class="brand">
      <div class="logo">CM</div>
      <h1>Cash Management <span>AI</span></h1>
      <p class="lead" id="lead-text">Войдите, чтобы открыть платформу.</p>
    </div>

    <div class="card">
      <div class="panel" id="panel-setup">
        <p class="sub">Первый вход: задайте логин и пароль администратора один раз. Потом эта форма закроется.</p>
        <div class="error" id="setup-error"></div>
        <form id="setup-form" autocomplete="off">
          <label class="lbl" for="setup-user">Логин</label>
          <input class="field" id="setup-user" type="text" value="admin" autocomplete="username" required />
          <label class="lbl" for="setup-pass">Пароль</label>
          <input class="field" id="setup-pass" type="password" autocomplete="new-password" required minlength="10" />
          <label class="lbl" for="setup-pass2">Повтор пароля</label>
          <input class="field" id="setup-pass2" type="password" autocomplete="new-password" required minlength="10" />
          <button class="btn" type="submit" id="setup-btn">Создать и войти</button>
        </form>
      </div>

      <div class="panel active" id="panel-login">
        <p class="sub">С «Запомнить меня» повторный вход не нужен, пока не нажмёте «Выйти».</p>
        <div class="error" id="error-box"></div>
        <form id="login-form" autocomplete="on">
          <label class="lbl" for="username">Логин</label>
          <input class="field" id="username" name="username" type="text" autocomplete="username" required autofocus />
          <label class="lbl" for="password">Пароль</label>
          <input class="field" id="password" name="password" type="password" autocomplete="current-password" required />
          <label class="remember">
            <input type="checkbox" id="remember" checked /> Запомнить меня
          </label>
          <button class="btn" type="submit" id="submit-btn">Войти</button>
        </form>
      </div>

      <div class="panel" id="panel-change">
        <p class="sub">Смените одноразовый пароль (мин. 10 символов, буква + цифра).</p>
        <div class="error" id="change-error"></div>
        <div class="ok" id="change-ok"></div>
        <form id="change-form" autocomplete="off">
          <label class="lbl" for="cur">Текущий пароль</label>
          <input class="field" id="cur" type="password" autocomplete="current-password" required />
          <label class="lbl" for="neu">Новый пароль</label>
          <input class="field" id="neu" type="password" autocomplete="new-password" required minlength="10" />
          <label class="lbl" for="neu2">Повтор нового пароля</label>
          <input class="field" id="neu2" type="password" autocomplete="new-password" required minlength="10" />
          <button class="btn" type="submit" id="change-btn">Сохранить и продолжить</button>
        </form>
      </div>
    </div>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const setupPanel = document.getElementById('panel-setup');
  const loginPanel = document.getElementById('panel-login');
  const changePanel = document.getElementById('panel-change');
  const errorBox = document.getElementById('error-box');
  const setupError = document.getElementById('setup-error');
  const changeError = document.getElementById('change-error');
  const changeOk = document.getElementById('change-ok');
  const leadText = document.getElementById('lead-text');

  function hideAll() {
    [setupPanel, loginPanel, changePanel].forEach((p) => p.classList.remove('active'));
  }
  function showLogin() {
    hideAll();
    loginPanel.classList.add('active');
    leadText.textContent = 'Войдите, чтобы открыть платформу.';
  }
  function showSetup() {
    hideAll();
    setupPanel.classList.add('active');
    leadText.textContent = 'Одноразовая регистрация администратора.';
  }
  function showChange() {
    hideAll();
    changePanel.classList.add('active');
    leadText.textContent = 'Смена пароля.';
  }
  function showErr(el, msg) {
    el.textContent = msg;
    el.style.display = 'block';
  }

  function wipe(el) {
    if (!el) return;
    el.value = '';
    el.defaultValue = '';
  }

  function wipeAllPasswords() {
    ['password', 'cur', 'neu', 'neu2', 'setup-pass', 'setup-pass2'].forEach((id) => wipe(document.getElementById(id)));
  }

  async function goNext() {
    wipeAllPasswords();
    const next = params.get('next');
    location.href = (next && next.startsWith('/') && !next.startsWith('//')) ? next : '/dashboard/index.html';
  }

  (async () => {
    try {
      const st = await fetch('/api/auth/setup-status', { cache: 'no-store' }).then((r) => r.json());
      if (st.auth_disabled) { location.href = '/dashboard/index.html'; return; }
      if (st.needed) { showSetup(); return; }
    } catch (_) {}
    try {
      const res = await fetch('/api/auth/me', { credentials: 'same-origin', cache: 'no-store' });
      if (!res.ok) return;
      const me = await res.json();
      if (me.auth_disabled) { location.href = '/dashboard/index.html'; return; }
      if (me.must_change_password || params.get('change') === '1') showChange();
    } catch (_) {}
  })();

  document.getElementById('setup-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    setupError.style.display = 'none';
    const user = document.getElementById('setup-user').value.trim() || 'admin';
    const p1 = document.getElementById('setup-pass').value;
    const p2 = document.getElementById('setup-pass2').value;
    if (p1 !== p2) { showErr(setupError, 'Пароли не совпадают'); return; }
    if (p1.length < 10 || !/[A-Za-z]/.test(p1) || !/\d/.test(p1)) {
      showErr(setupError, 'Пароль: минимум 10 символов, буква и цифра');
      return;
    }
    wipe(document.getElementById('setup-pass'));
    wipe(document.getElementById('setup-pass2'));
    const btn = document.getElementById('setup-btn');
    btn.disabled = true;
    btn.textContent = 'Сохраняем…';
    try {
      const res = await fetch('/api/auth/setup', {
        method: 'POST',
        credentials: 'same-origin',
        cache: 'no-store',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: user, password: p1, password2: p1 }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        showErr(setupError, data.detail || 'Не удалось создать admin');
        return;
      }
      await goNext();
    } catch (_) {
      showErr(setupError, 'Сервер недоступен');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Создать и войти';
    }
  });

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    const btn = document.getElementById('submit-btn');
    const passEl = document.getElementById('password');
    const username = document.getElementById('username').value.trim();
    const password = passEl.value;
    const remember = document.getElementById('remember').checked;
    wipe(passEl);
    btn.disabled = true;
    btn.textContent = 'Входим…';
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        credentials: 'same-origin',
        cache: 'no-store',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password, remember_me: remember }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        showErr(errorBox, data.detail || 'Не удалось войти');
        return;
      }
      if (data.user && data.user.must_change_password) {
        showChange();
        return;
      }
      await goNext();
    } catch (err) {
      showErr(errorBox, 'Сервер недоступен');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Войти';
    }
  });

  document.getElementById('change-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    changeError.style.display = 'none';
    changeOk.style.display = 'none';
    const curEl = document.getElementById('cur');
    const neuEl = document.getElementById('neu');
    const neu2El = document.getElementById('neu2');
    const cur = curEl.value;
    const neu = neuEl.value;
    const neu2 = neu2El.value;
    if (neu !== neu2) {
      showErr(changeError, 'Пароли не совпадают');
      return;
    }
    if (neu.length < 10 || !/[A-Za-z]/.test(neu) || !/\d/.test(neu)) {
      showErr(changeError, 'Пароль: минимум 10 символов, буква и цифра');
      return;
    }
    wipe(curEl); wipe(neuEl); wipe(neu2El);
    const btn = document.getElementById('change-btn');
    btn.disabled = true;
    try {
      const res = await fetch('/api/auth/change-password', {
        method: 'POST',
        credentials: 'same-origin',
        cache: 'no-store',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ current_password: cur, new_password: neu }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        showErr(changeError, data.detail || 'Не удалось сменить пароль');
        return;
      }
      changeOk.textContent = 'Пароль сохранён';
      changeOk.style.display = 'block';
      await goNext();
    } catch (err) {
      showErr(changeError, 'Сервер недоступен');
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
